[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/getcadcraft/bimcraft"

[workspace.dependencies]
bimcraft-geom = { path = "crates/geom" }
bimcraft-bim = { path = "crates/bim" }
bimcraft-engine = { path = "crates/engine" }
bimcraft-render = { path = "crates/render" }
bimcraft-ui-egui = { path = "crates/ui-egui" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
